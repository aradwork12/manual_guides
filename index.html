<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exodigo field guides</title>
<style>
  :root { --bg: #f6f8f7; --card: #ffffff; --ink: #14201b; --ink-2: #51605a; --line: #dfe6e2; --accent: #1f9d74; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1413; --card: #181f1d; --ink: #e8efec; --ink-2: #a3b1ab; --line: #2a3330; --accent: #4fd1a5; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { color: var(--ink-2); margin: 0 0 28px; }
  a.guide { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; color: inherit; text-decoration: none; margin-bottom: 14px; }
  a.guide:hover { border-color: var(--accent); }
  a.guide b { display: block; font-size: 19px; color: var(--accent); }
  a.guide span { color: var(--ink-2); font-size: 15px; }
  .en { direction: ltr; text-align: left; }
</style>
</head>
<body>
<main>
  <h1>מדריכי שטח · Field guides</h1>
  <p class="sub">Exodigo</p>
  <a class="guide" href="hammer-box-v2/">
    <b>Hammer Box v2 · ExoTerra</b>
    <span>מדריך שטח לסקר ססמי עם פטיש: התחברות, RTK, מכות מול גיאופונים והעלאה לענן.</span>
    <span class="en" style="display:block">Field guide for the hammer seismic survey: connect, RTK, hits at each geophone, cloud upload.</span>
  </a>
</main>
</body>
</html>
